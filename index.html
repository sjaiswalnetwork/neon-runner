<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Runner</title>
<meta name="description" content="A cyberpunk synthwave runner. Dodge barriers, grab data shards, survive the grid.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0014'/><polygon points='16,6 27,26 5,26' fill='none' stroke='%23ff2a6d' stroke-width='3'/></svg>">
<style>
:root{--pink:#ff2a6d;--cyan:#05d9e8;--purp:#b967ff;--yel:#f9f002;--bg:#0a0014}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:#fff;font-family:'Courier New',Consolas,monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh}
.hud{position:fixed;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;font-weight:900;letter-spacing:2px;font-size:clamp(12px,2.4vw,18px);pointer-events:none;text-shadow:0 0 8px currentColor}
.hud .s{color:var(--cyan)} .hud .h{color:var(--yel)} .hud .m{color:var(--pink)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:16px;background:radial-gradient(ellipse at center,rgba(10,0,20,.55),rgba(10,0,20,.92))}
.hidden{display:none}
h1{font-size:clamp(38px,9vw,96px);letter-spacing:.12em;position:relative;color:#fff;text-shadow:0 0 12px #fff,0 0 30px var(--pink)}
h1::before,h1::after{content:attr(data-t);position:absolute;inset:0;mix-blend-mode:screen}
h1::before{color:var(--cyan);animation:ga 2.4s infinite steps(1)} h1::after{color:var(--pink);animation:gb 2s infinite steps(1)}
@keyframes ga{0%,100%{transform:translate(-3px,0)}20%{transform:translate(-9px,2px);clip-path:inset(20% 0 50% 0)}22%{transform:translate(-3px,0);clip-path:none}}
@keyframes gb{0%,100%{transform:translate(3px,0)}50%{transform:translate(10px,-2px);clip-path:inset(60% 0 10% 0)}52%{transform:translate(3px,0);clip-path:none}}
.sub{color:var(--yel);letter-spacing:.3em;font-weight:900;font-size:clamp(11px,2.2vw,16px)}
.btn{font:900 clamp(18px,3.4vw,26px) 'Courier New',monospace;letter-spacing:.2em;color:#fff;background:rgba(255,42,109,.15);border:3px solid var(--pink);padding:14px 34px;border-radius:6px;cursor:pointer;box-shadow:0 0 18px var(--pink),inset 0 0 18px rgba(255,42,109,.4);animation:pulse 1.2s ease-in-out infinite}
.btn:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
@keyframes pulse{50%{box-shadow:0 0 34px var(--pink),inset 0 0 26px rgba(255,42,109,.6)}}
.help{color:#d1c6ff;font-size:clamp(11px,2vw,14px);line-height:1.8;max-width:560px}
.help b{color:var(--cyan)}
.big{font-size:clamp(28px,6vw,56px);color:var(--cyan);font-weight:900;text-shadow:0 0 14px var(--cyan)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
a.small{color:var(--purp);font-size:13px;letter-spacing:.15em}
.mute{position:fixed;bottom:14px;right:16px;background:none;border:2px solid var(--purp);color:var(--purp);font:900 12px 'Courier New';letter-spacing:2px;padding:6px 10px;border-radius:4px;cursor:pointer}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.flash{position:fixed;inset:0;pointer-events:none;background:var(--pink);opacity:0;mix-blend-mode:screen}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span class="s">SCORE <span id="score">0</span></span><span class="m" id="mult"></span><span class="h">HI <span id="hi">0</span></span></div>
<div class="flash" id="flash"></div>
<div class="scan"></div>

<div class="screen" id="start">
  <h1 data-t="NEON RUNNER">NEON RUNNER</h1>
  <div class="sub">DODGE · COLLECT · SURVIVE THE GRID</div>
  <button class="btn" id="play">▶ PLAY</button>
  <p class="help"><b>←/→</b> or <b>A/D</b> switch lanes · <b>SPACE</b> overdrive (jump)<br>Mobile: <b>tap left/right</b> side · <b>swipe up</b> to jump<br>◆ shards = +50 & combo · ▬ barriers = game over</p>
  <a class="small" href="https://github.com/sjaiswalnetwork">// built by @sjaiswalnetwork</a>
</div>

<div class="screen hidden" id="over">
  <h1 data-t="SYSTEM CRASH">SYSTEM CRASH</h1>
  <div class="big" id="final">0</div>
  <div class="sub" id="best"></div>
  <div class="row"><button class="btn" id="again">↻ RUN AGAIN</button></div>
  <a class="small" href="https://github.com/sjaiswalnetwork">◀ back to @sjaiswalnetwork</a>
</div>
<button class="mute" id="mute">SOUND: ON</button>

<script>
(() => {
const C = {pink:'#ff2a6d', cyan:'#05d9e8', purp:'#b967ff', yel:'#f9f002'};
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR, HZ;
function resize(){ DPR = Math.min(window.devicePixelRatio||1, 2); W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); HZ = H*0.42; }
addEventListener('resize', resize); resize();

// ---------- storage (best effort) ----------
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
let hi = +store.get('nr_hi') || 0; document.getElementById('hi').textContent = hi;

// ---------- audio ----------
let actx = null, muted = store.get('nr_mute') === '1';
const muteBtn = document.getElementById('mute');
const setMuteLabel = () => muteBtn.textContent = 'SOUND: ' + (muted ? 'OFF' : 'ON'); setMuteLabel();
muteBtn.onclick = () => { muted = !muted; store.set('nr_mute', muted ? '1':'0'); setMuteLabel(); };
function beep(f, d=0.08, type='square', v=0.06, slide=0){
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide), t+d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d);
  } catch(e){}
}

// ---------- world ----------
const LANES = [-1, 0, 1];
let state = 'start', score, speed, dist, objs, spawnT, lane, laneX, jumpT, combo, comboT, shake, particles, stars, t0;
stars = Array.from({length:120}, () => ({x:Math.random(), y:Math.random()*0.95, r:Math.random()*1.4+.3, p:Math.random()*6}));
const sky = Array.from({length:34}, (_,i) => ({x:i/34, w:0.018+Math.random()*0.03, h:0.04+Math.random()*0.16, win:Array.from({length:4},()=>[Math.random(),Math.random(),Math.random()<.5?C.cyan:C.pink])}));

function reset(){
  score = 0; speed = 0.55; dist = 0; objs = []; spawnT = 0; lane = 0; laneX = 0; jumpT = 0; combo = 1; comboT = 0; shake = 0; particles = [];
}
reset();

// perspective: d = 1 at horizon, 0 at player
function proj(d, lx){
  const t = Math.pow(1 - d, 2.2);
  const y = HZ + (H - HZ) * t;
  const roadHalf = W * 0.42 * t + W * 0.012;
  return {x: W/2 + lx * roadHalf * 0.66, y, s: t};
}

function spawn(){
  const pattern = Math.random();
  const free = LANES[Math.floor(Math.random()*3)];
  if (pattern < 0.55){
    // 1-2 barriers, always leave a gap
    LANES.forEach(l => { if (l !== free && Math.random() < 0.6) objs.push({type:'bar', lane:l, d:1, c:[C.pink,C.yel,C.purp][Math.floor(Math.random()*3)]}); });
    objs.push({type:'shard', lane:free, d:1.04});
  } else if (pattern < 0.8){
    objs.push({type:'shard', lane:free, d:1}); objs.push({type:'shard', lane:free, d:1.06}); objs.push({type:'shard', lane:free, d:1.12});
  } else {
    // low wall across all lanes: must jump
    objs.push({type:'wall', lane:0, d:1, c:C.cyan});
  }
}

function burst(x, y, col, n=18){ for (let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-.5)*9,vy:(Math.random()-.9)*8,l:1,c:col}); }

// ---------- input ----------
function move(dir){ if (state!=='play') return; const nl = Math.max(-1, Math.min(1, lane+dir)); if (nl!==lane){ lane = nl; beep(520+dir*80,.05,'triangle',.05); } }
function jump(){ if (state!=='play' || jumpT>0) return; jumpT = 0.75; beep(300,.25,'sawtooth',.05,600); }
addEventListener('keydown', e => {
  if (['ArrowLeft','a','A'].includes(e.key)) { move(-1); e.preventDefault(); }
  else if (['ArrowRight','d','D'].includes(e.key)) { move(1); e.preventDefault(); }
  else if ([' ','ArrowUp','w','W'].includes(e.key)) { if (state==='play') jump(); else if (e.key===' ') begin(); e.preventDefault(); }
  else if (e.key==='Enter' && state!=='play') begin();
});
let tx=0, ty=0, tt=0;
cv.addEventListener('touchstart', e => { const t=e.touches[0]; tx=t.clientX; ty=t.clientY; tt=performance.now(); }, {passive:true});
cv.addEventListener('touchend', e => {
  const t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty;
  if (dy < -40 && Math.abs(dy) > Math.abs(dx)) jump();
  else if (Math.abs(dx) > 40) move(dx>0?1:-1);
  else move(t.clientX < W/2 ? -1 : 1);
}, {passive:true});

const startEl = document.getElementById('start'), overEl = document.getElementById('over');
function begin(){ reset(); state='play'; startEl.classList.add('hidden'); overEl.classList.add('hidden'); beep(440,.1); beep(660,.15,'square',.05); }
document.getElementById('play').onclick = begin;
document.getElementById('again').onclick = begin;

function crash(){
  state = 'over'; shake = 22; burst(proj(0.03, laneX).x, H-90, C.pink, 50);
  beep(180,.5,'sawtooth',.09,-150);
  const f = document.getElementById('flash'); f.style.transition='none'; f.style.opacity=.7; requestAnimationFrame(()=>{ f.style.transition='opacity .6s'; f.style.opacity=0; });
  const s = Math.floor(score);
  const isHi = s > hi; if (isHi){ hi = s; store.set('nr_hi', hi); document.getElementById('hi').textContent = hi; }
  document.getElementById('final').textContent = s;
  document.getElementById('best').textContent = isHi ? '★ NEW HIGH SCORE ★' : 'HIGH SCORE ' + hi;
  setTimeout(() => { overEl.classList.remove('hidden'); document.getElementById('again').focus(); }, 700);
}

// ---------- update ----------
function update(dt){
  const tsec = performance.now()/1000;
  if (state === 'play'){
    speed = Math.min(1.55, speed + dt*0.012);
    dist += dt*speed; score += dt*speed*40*combo;
    spawnT -= dt; if (spawnT <= 0){ spawn(); spawnT = Math.max(0.42, 1.15 - speed*0.45); }
    if (jumpT > 0) jumpT = Math.max(0, jumpT - dt);
    if (comboT > 0){ comboT -= dt; if (comboT <= 0) combo = 1; }
  }
  laneX += (lane - laneX) * Math.min(1, dt*14);
  const dd = dt * speed * 0.62;
  for (const o of objs) o.d -= state==='play' ? dd : dd*0.15;
  if (state === 'play'){
    const air = jumpT > 0.12 && jumpT < 0.68;
    for (const o of objs){
      if (o.hit || o.d > 0.05 || o.d < -0.02) continue;
      const sameLane = o.type==='wall' || Math.abs(o.lane - laneX) < 0.5;
      if (!sameLane) continue;
      if (o.type === 'shard'){ o.hit = true; combo = Math.min(8, combo+1); comboT = 2.2; score += 50*combo; const p=proj(o.d,o.lane); burst(p.x,p.y-20,C.cyan,14); beep(880+combo*60,.07,'square',.05); }
      else if (!air){ o.hit = true; crash(); break; }
    }
  }
  objs = objs.filter(o => o.d > -0.08 && !(o.hit && o.type==='shard'));
  for (const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.l-=dt*1.4; }
  particles = particles.filter(p => p.l > 0);
  shake *= 0.88;
  document.getElementById('score').textContent = Math.floor(score);
  document.getElementById('mult').textContent = combo > 1 ? '×' + combo + ' COMBO' : '';
}

// ---------- draw ----------
function glow(c, b){ ctx.shadowColor = c; ctx.shadowBlur = b; }
function draw(){
  const t = performance.now()/1000;
  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
  // sky
  let g = ctx.createLinearGradient(0,0,0,HZ); g.addColorStop(0,'#05000d'); g.addColorStop(1,'#4a0a4f');
  ctx.fillStyle = g; ctx.fillRect(-30,-30,W+60,HZ+30);
  for (const s of stars){ ctx.globalAlpha = .4 + .6*Math.abs(Math.sin(t*1.3+s.p)); ctx.fillStyle='#fff'; ctx.fillRect(s.x*W, s.y*HZ, s.r, s.r); }
  ctx.globalAlpha = 1;
  // sun
  const R = Math.min(W,H)*0.2;
  g = ctx.createLinearGradient(0,HZ-R,0,HZ); g.addColorStop(0,C.yel); g.addColorStop(1,C.pink);
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,HZ); ctx.clip();
  glow(C.pink, 40); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(W/2, HZ, R, Math.PI, 0); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#2a0640';
  for (let i=0;i<7;i++){ const yy = HZ - R*0.08 - i*R*0.11 - ((t*12)%(R*0.11)); ctx.fillRect(W/2-R, yy, R*2, 2+i*0.0+ (7-i)*0.6); }
  ctx.restore();
  // skyline
  ctx.fillStyle = '#0d0120';
  for (const b of sky){ const bx = b.x*W, bw = b.w*W, bh = b.h*Math.min(H, W*0.6)*(Math.abs(b.x-.5)<.12?0.35:1); ctx.fillRect(bx, HZ-bh, bw, bh);
    for (const w of b.win){ ctx.fillStyle = w[2]; ctx.globalAlpha = .5+.5*Math.sin(t*2+w[0]*9); ctx.fillRect(bx+w[0]*bw*0.8, HZ-bh+w[1]*bh*0.85, 2, 2); ctx.globalAlpha=1; ctx.fillStyle='#0d0120'; } }
  // ground
  ctx.fillStyle = '#0a0014'; ctx.fillRect(-30, HZ, W+60, H-HZ+30);
  ctx.save(); glow(C.pink, 8); ctx.strokeStyle = C.pink; ctx.lineWidth = 1.4; ctx.globalAlpha = .85;
  const off = (dist*6) % 1;
  for (let i=0;i<22;i++){ const d = 1 - ((i+off)/22); const p = proj(Math.max(0,d), 0); ctx.beginPath(); ctx.moveTo(0,p.y); ctx.lineTo(W,p.y); ctx.stroke(); }
  for (let k=-12;k<=12;k++){ const a = proj(1, k*0.5), b = proj(0, k*0.5); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(W/2 + (b.x-W/2)*1.6, H); ctx.stroke(); }
  ctx.restore();
  // road
  const l1 = proj(1,-1.6), l2 = proj(1,1.6), l3 = proj(0,1.6), l4 = proj(0,-1.6);
  ctx.fillStyle = 'rgba(20,0,42,.88)'; ctx.beginPath(); ctx.moveTo(l1.x,l1.y); ctx.lineTo(l2.x,l2.y); ctx.lineTo(l3.x*1.02,H); ctx.lineTo(l4.x*0.98,H); ctx.fill();
  ctx.save(); glow(C.cyan, 10); ctx.strokeStyle = C.cyan; ctx.lineWidth = 3;
  for (const lx of [-0.5, 0.5]){ for (let i=0;i<14;i++){ const d0 = 1-((i+off*2)%14)/14, d1 = Math.max(0,d0-0.035); const a=proj(d0,lx), b=proj(d1,lx); ctx.lineWidth = 1+3*b.s; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); } }
  ctx.strokeStyle = C.purp; for (const lx of [-1.6,1.6]){ const a=proj(1,lx), b=proj(0,lx); ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,H); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = C.cyan; glow(C.cyan, 14); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,HZ); ctx.lineTo(W,HZ); ctx.stroke(); ctx.shadowBlur = 0;
  // objects far → near
  const sorted = objs.slice().sort((a,b)=>b.d-a.d);
  for (const o of sorted){
    if (o.d > 1) continue;
    const p = proj(Math.max(0,o.d), o.lane);
    const sz = 8 + 120*p.s;
    ctx.save();
    if (o.type === 'shard'){
      glow(C.cyan, 18); ctx.fillStyle = C.cyan; const r = sz*0.28, yy = p.y - sz*0.45 + Math.sin(t*6+o.lane)*4*p.s;
      ctx.translate(p.x, yy); ctx.rotate(t*2); ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(r*.7,0); ctx.lineTo(0,r); ctx.lineTo(-r*.7,0); ctx.closePath(); ctx.fill();
    } else if (o.type === 'bar'){
      glow(o.c, 20); ctx.strokeStyle = o.c; ctx.lineWidth = 2+4*p.s; ctx.fillStyle = o.c + '33';
      const w = sz*1.1, h = sz*0.42; ctx.fillRect(p.x-w/2, p.y-h, w, h); ctx.strokeRect(p.x-w/2, p.y-h, w, h);
      ctx.beginPath(); ctx.moveTo(p.x-w/2, p.y-h); ctx.lineTo(p.x+w/2, p.y); ctx.moveTo(p.x+w/2, p.y-h); ctx.lineTo(p.x-w/2, p.y); ctx.globalAlpha=.5; ctx.stroke();
    } else {
      const a = proj(Math.max(0,o.d), -1.5), b = proj(Math.max(0,o.d), 1.5), h = sz*0.22;
      glow(C.cyan, 22); ctx.fillStyle = 'rgba(5,217,232,.25)'; ctx.strokeStyle = C.cyan; ctx.lineWidth = 2+3*p.s;
      ctx.fillRect(a.x, p.y-h, b.x-a.x, h); ctx.strokeRect(a.x, p.y-h, b.x-a.x, h);
      if (p.s > .15){ ctx.shadowBlur = 0; ctx.fillStyle = C.yel; ctx.font = `900 ${Math.max(10, 22*p.s)}px Courier New`; ctx.textAlign='center'; ctx.fillText('▲ JUMP', p.x, p.y-h-8); }
    }
    ctx.restore();
  }
  // player
  if (state !== 'over' || shake > 1){
    const p = proj(0.02, laneX); const j = jumpT > 0 ? Math.sin((1 - jumpT/0.75)*Math.PI) : 0;
    const y = H - 70 - j*110, w = Math.min(110, W*0.16), h = w*0.55;
    ctx.save(); glow(C.pink, 26);
    ctx.fillStyle = 'rgba(255,42,109,.25)'; ctx.beginPath(); ctx.ellipse(p.x, H-58, w*0.5*(1-j*0.4), 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.translate(p.x, y); ctx.rotate((lane - laneX)*-0.25);
    ctx.fillStyle = '#0a0014'; ctx.strokeStyle = C.pink; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0,-h); ctx.lineTo(w/2, h*0.35); ctx.lineTo(-w/2, h*0.35); ctx.closePath(); ctx.fill(); ctx.stroke();
    glow(C.yel, 16); ctx.fillStyle = C.yel; ctx.fillRect(-w*0.38, h*0.22, w*0.2, 8); ctx.fillRect(w*0.18, h*0.22, w*0.2, 8);
    ctx.strokeStyle = C.cyan; glow(C.cyan, 12); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,-h*0.55); ctx.lineTo(w*0.18, h*0.1); ctx.lineTo(-w*0.18, h*0.1); ctx.closePath(); ctx.stroke();
    // exhaust
    ctx.globalAlpha = .7; ctx.fillStyle = C.purp; for (let i=0;i<4;i++){ ctx.fillRect((Math.random()-.5)*w*0.5, h*0.4+i*7+Math.random()*4, 3, 4); }
    ctx.restore();
  }
  // particles
  for (const q of particles){ ctx.globalAlpha = q.l; ctx.fillStyle = q.c; glow(q.c, 10); ctx.fillRect(q.x, q.y, 4, 4); }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  // glitch slices
  if (Math.random() < (state==='play' ? 0.02 + speed*0.01 : 0.05)){
    const y = Math.random()*H, h = 4 + Math.random()*24;
    try { ctx.drawImage(cv, 0, y*DPR, W*DPR, h*DPR, (Math.random()-.5)*40, y, W, h); } catch(e){}
    ctx.fillStyle = Math.random()<.5 ? 'rgba(5,217,232,.25)' : 'rgba(255,42,109,.25)'; ctx.fillRect(0, y, W, h*0.4);
  }
  ctx.restore();
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if (state !== 'start') update(dt); else { laneX = Math.sin(now/700)*0.9; dist += dt*0.5; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
